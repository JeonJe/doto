<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도토</title><link rel="icon" href="/pet.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><div class="page"><section class="app" id="app-window" aria-label="도토"><header class="app-bar"><span class="brand"><img src="/pet.svg" alt="">도토</span><div class="bar-actions"><button class="icon-button" id="tool-menu-button" data-action="tool-menu" aria-label="모니터링 관리" aria-expanded="false" hidden>⋯</button><button class="update-indicator" id="update-indicator" data-action="show-updates" hidden></button><button class="icon-button" data-action="hide" aria-label="도토 숨기기" title="창을 숨겨도 확인은 계속해요">−</button></div><div class="tool-menu" id="tool-menu" aria-label="모니터링 관리 메뉴" hidden><button data-action="monitor-edit">확인 주기 변경</button><button class="danger" data-action="remove-start">목록에서 빼기</button></div></header><main id="screen" class="screen"><div class="loading" role="status"><span class="spinner"></span>설치된 도구를 확인하고 있어요.</div></main></section><div class="reopen-bar" id="reopen-bar" hidden><button class="secondary" id="reopen" data-action="reopen">도토 열기</button></div></div><section class="notification" id="notification" aria-label="업데이트 알림" hidden><button class="notification-close" data-action="dismiss-notification" aria-label="알림 닫기">×</button><span class="eyebrow">새 버전</span><h2 id="notification-title"></h2><p id="notification-copy"></p><button class="primary" data-action="open-notification">내용 보기</button><img src="/pet.svg" alt="도토"></section><div id="toast" class="toast" role="status" hidden></div><div class="sr-only" id="announcer" role="status" aria-live="polite"></div></body></html>
